[package]
name = "agentns-claude"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Wraps a command in a wintermute agent namespace so /proc/$PID/agent_session reads stably from birth."
repository = "https://github.com/j0yen/agentns-claude"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
mem_forget = "deny"
as_conversions = "warn"
float_arithmetic = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "warn"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[[bin]]
name = "agentns-claude"
path = "src/main.rs"

[lib]
name = "agentns_claude"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["time", "user"] }

[dev-dependencies]
assert_cmd = "2"
